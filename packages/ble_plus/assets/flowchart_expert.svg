<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box{fill:#f8fafc;stroke:#0f172a;stroke-width:2;rx:8;}
    .label{font:16px 'Segoe UI', Roboto, Arial; fill:#0f172a}
    .title{font:18px 'Segoe UI', Roboto, Arial; font-weight:700}
    .note{font:12px; fill:#334155}
    .arrow{stroke:#0f172a;stroke-width:2;fill:none;marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a" />
    </marker>
  </defs>

  <text x="40" y="28" class="title">ble_plus — Expert Flow (detailed)</text>

  <!-- App layer -->
  <rect x="40" y="60" width="260" height="70" class="box" rx="8" />
  <text x="90" y="100" class="label">App UI / Business Logic</text>

  <!-- API layer -->
  <rect x="420" y="30" width="320" height="140" class="box" rx="8" />
  <text x="500" y="60" class="title">Public API (Dart)</text>
  <text x="450" y="90" class="label">BleCentral · BlePeripheral · BleConnection</text>
  <text x="450" y="110" class="label">AdvertiseSettings · GattServiceDefinition · L2CAP</text>

  <!-- Platform interface -->
  <rect x="780" y="30" width="320" height="140" class="box" rx="8" />
  <text x="900" y="60" class="title">Platform Interface</text>
  <text x="840" y="95" class="label">ble_plus_platform_interface (types, contracts)</text>

  <!-- Platform implementations -->
  <rect x="40" y="240" width="1060" height="200" class="box" rx="8" />
  <text x="520" y="270" class="title">Platform Implementations</text>

  <rect x="80" y="300" width="200" height="120" class="box" rx="8" />
  <text x="115" y="360" class="label">Android (Kotlin)\nBluetoothGatt / GATT Server</text>

  <rect x="320" y="300" width="200" height="120" class="box" rx="8" />
  <text x="365" y="360" class="label">iOS/macOS (Swift)\nCoreBluetooth</text>

  <rect x="560" y="300" width="200" height="120" class="box" rx="8" />
  <text x="605" y="360" class="label">Windows (C++)\nWinRT BLE</text>

  <rect x="800" y="300" width="200" height="120" class="box" rx="8" />
  <text x="845" y="360" class="label">Linux (C/C++)\nBlueZ D-Bus</text>

  <rect x="320" y="440" width="200" height="100" class="box" rx="8" />
  <text x="345" y="480" class="label">Web (Dart)\nWeb Bluetooth API</text>

  <!-- Native stacks note -->
  <text x="60" y="520" class="note">Notes: Event streams (scan, connection, characteristic), capability checks, permission handling, background restoration (iOS) and foreground services (Android).</text>

  <!-- arrows -->
  <path d="M300 95 L420 95" class="arrow" />
  <path d="M740 95 L780 95" class="arrow" />
  <path d="M880 170 L880 240" class="arrow" />
  <path d="M700 240 L700 300" class="arrow" />

  <!-- API -> Implementations arrows -->
  <path d="M580 170 L580 300" class="arrow" />
  <path d="M900 170 L900 300" class="arrow" />

  <!-- L2CAP and streams -->
  <rect x="420" y="470" width="320" height="90" class="box" rx="8" />
  <text x="500" y="505" class="label">L2CAP Channels · High-throughput streams</text>
  <text x="500" y="525" class="label">Event streams: scan, state, bond, mtu, l2cap</text>

  <path d="M580 440 L580 470" class="arrow" />

  <!-- footer -->
  <text x="40" y="760" class="note">Expert Legend: flow shows call/stream paths and platform separation. Uses instance-based API, DI-friendly, platform contracts enforced by the platform interface.</text>
</svg>