name: ble_plus
description: A production-ready Flutter BLE plugin supporting Central and Peripheral roles, L2CAP, background operation, and connection parameters.
version: 1.0.0
homepage: https://github.com/ajinkya446/ble_plus
repository: https://github.com/ajinkya446/ble_plus
issue_tracker: https://github.com/ajinkya446/ble_plus/issues

topics:
  - ble
  - bluetooth
  - bluetooth-low-energy
  - peripheral

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.ble_plus
        pluginClass: BlePlusPlugin
      ios:
        pluginClass: BlePlusPlugin
      macos:
        pluginClass: BlePlusPlugin
      web:
        pluginClass: BlePlusWeb
        fileName: src/platform/ble_plus_web.dart
      linux:
        dartPluginClass: BlePlusLinux
      windows:
        pluginClass: BlePlusPlugin
